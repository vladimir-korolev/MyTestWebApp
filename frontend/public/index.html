<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Store</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        .section { margin: 30px 0; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        input, button { padding: 10px; margin: 5px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; padding: 10px; background: #f8f9fa; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Object Store Application</h1>
    
    <div class="section">
        <h2>Put Object</h2>
        <input type="text" id="putId" placeholder="Object ID">
        <input type="text" id="putValue" placeholder="Object Value">
        <button onclick="putObject()">Store Object</button>
    </div>

    <div class="section">
        <h2>Get Object</h2>
        <input type="text" id="getId" placeholder="Object ID">
        <button onclick="getObject()">Retrieve Object</button>
    </div>

    <div id="result"></div>

    <script>
        async function putObject() {
            const id = document.getElementById('putId').value;
            const value = document.getElementById('putValue').value;
            
            try {
                const response = await fetch('/put_object', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, value })
                });
                const data = await response.json();
                document.getElementById('result').innerHTML = 
                    `<strong>Success:</strong> ${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    `<strong>Error:</strong> ${error.message}`;
            }
        }

        async function getObject() {
            const id = document.getElementById('getId').value;
            
            try {
                const response = await fetch(`/get_object/${id}`);
                const data = await response.json();
                document.getElementById('result').innerHTML = 
                    `<strong>Result:</strong> ${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    `<strong>Error:</strong> ${error.message}`;
            }
        }
    </script>
</body>
</html>
